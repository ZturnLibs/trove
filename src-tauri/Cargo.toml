[package]
name = "trove"
version = "2.2.1"
description = "Trove — 一站式个人工作台"
authors = ["you"]
edition = "2021"
default-run = "trove"

[lib]
name = "trove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
parking_lot = "0.12"
directories = "6"
sha2 = "0.10"
hex = "0.4"
iana-time-zone = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
csv = "1.3"

[[bin]]
name = "trove-cli"
path = "src/bin/trove-cli.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }

[features]
# 生产构建（tauri build 自动启用）：tauri v2 以此区分 dev/prod——未启用时 debug
# 二进制加载 build.devUrl（tauri.conf.json），启用后 codegen 内嵌 frontendDist。
# e2e（tests/e2e）依赖此 feature 内嵌前端资产；build 与 test 须带同一 feature 集
# （cargo test 会重编 bin，指纹不一致会把 trove 退回 dev 模式）。
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "3"
# e2e (`tests/e2e`): WebDriver client + async runtime; gated behind `E2E=1`
# and `#[ignore]` so default `cargo test` builds but never runs them.
fantoccini = { version = "0.22", default-features = false, features = ["rustls-tls"] }
# fantoccini 关默认 feature 后 rustls 无 CryptoProvider（CI 首跑 panic 实证）；
# 显式启用 ring（纯 Rust，CI 无需 cmake），并在 helper 里幂等 install_default。
rustls = { version = "0.23", features = ["ring"] }
tokio = { version = "1", features = ["full"] }
