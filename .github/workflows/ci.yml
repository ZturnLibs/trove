name: ci

on:
  push:
    branches: [main]
  pull_request:
  # 手动/API 直发 run：事件管线故障时可绕过 webhook 入队（`gh workflow run ci -R <repo> --ref <branch>`）
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test

  e2e:
    runs-on: ubuntu-latest
    # 兜底：任何残留挂起最多烧 45min（最坏合法情形：8 条用例各 270s 上限 + 构建），
    # 超时属 failure，artifact 上传仍会执行；此前无显示服务器时曾挂满 6h job 上限。
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
        working-directory: ${{ github.workspace }}
      - name: Install Linux Tauri deps + WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus at-spi2-core
          cargo install tauri-driver --locked
          cargo install tauri-cli --locked
          # 预热字体缓存：WebKitGTK 首启冷建 fc 缓存可达数十秒，避免首个用例撞连接超时
          fc-cache -f
      - name: Build app + e2e tests
        # 必须 tauri build --debug（设计文档指定路径）：纯 cargo build 的 debug 二进制
        # 走 devUrl（CI 无 vite dev server）→ 白窗 → 侧栏永不出现（run 40727225974）。
        # --debug=未优化二进制，--no-bundle=跳过打包；beforeBuildCommand 自动 pnpm build
        # 产出 dist/ 内嵌进二进制。
        run: |
          cargo tauri build --debug --no-bundle
          cargo test --test e2e --no-run
      - name: Run e2e smoke
        env:
          E2E: "1"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
          # 无 GPU 环境 WebKitGTK DMABUF 渲染路径可能卡死/花屏；软件渲染兜底。
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        # ubuntu-latest 无显示服务器也无 session DBus：WebKitGTK 自动化走 AT-SPI
        # 可访问性树（run 40703046029 的 tauri-driver.log：org.a11y.Bus ServiceUnknown
        # 后握手永不返回），dbus-run-session 提供 session bus；xvfb-run 提供假显示
        # （官方 CI 指南方案）。fc-cache 预热首启的字体缓存，避免首用例冷启超时。
        run: dbus-run-session -- xvfb-run -a cargo test --test e2e -- --ignored --nocapture
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
