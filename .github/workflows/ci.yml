name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo test

  e2e:
    runs-on: ubuntu-latest
    # 兜底：任何残留挂起最多烧 35min（最坏合法情形：8 条用例各 180s 上限 + 构建 ≈30min），
    # 超时属 failure，artifact 上传仍会执行；此前无显示服务器时曾挂满 6h job 上限。
    timeout-minutes: 35
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux Tauri deps + WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
      - name: Build app + e2e tests
        run: |
          cargo build
          cargo test --test e2e --no-run
      - name: Run e2e smoke
        env:
          E2E: "1"
          E2E_ARTIFACT_DIR: ${{ github.workspace }}/e2e-artifacts
        # ubuntu-latest 无显示服务器：WebKitGTK 的 app 必须有 X 才能开窗，
        # 否则 WebKitWebDriver 会话创建永不返回（官方 CI 指南即 xvfb-run 方案）。
        run: xvfb-run -a cargo test --test e2e -- --ignored --nocapture
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          if-no-files-found: ignore
